<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Starttimer">
  <title>Starttimer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

    body {
      display: flex; flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      background: #fff;
      font-family: 'Oswald', sans-serif;
    }

    #flash {
      position: fixed; inset: 0; pointer-events: none;
      z-index: 999; opacity: 0; transition: opacity 0.05s;
    }
    #flash.active { opacity: 1; }

    #recall-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(200,0,0,0.96); z-index: 500;
      flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    #recall-overlay.visible { display: flex; }
    .recall-title { font-size: 72px; font-weight: 700; color: #fff; letter-spacing: 2px; }
    .recall-sub   { font-size: 16px; color: rgba(255,255,255,0.75); font-family: sans-serif; }
    .btn-recall-close {
      margin-top: 20px; padding: 16px 52px; background: #fff;
      color: #cc0000; border: none; border-radius: 10px;
      font-size: 26px; font-weight: 700; cursor: pointer;
    }

    .block {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; min-height: 0; background: #fff;
    }

    #phase-stripe { height: 5px; flex-shrink: 0; background: #ddd; transition: background 0.4s; }

    .corner {
      position: absolute; top: 10px; left: 16px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; color: #bbb;
    }

    .dots { position: absolute; top: 14px; right: 16px; display: flex; gap: 7px; }
    .sdot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid #ddd; background: transparent; transition: all 0.3s;
    }
    .sdot.fired { border-color: transparent; }

    .big-num {
      font-weight: 700;
      font-size: clamp(80px, 23vh, 180px);
      letter-spacing: -2px; line-height: 1;
      color: #000; transition: color 0.2s;
      text-align: center; width: 100%; padding: 0 6px;
      transform: scaleX(0.82);
    }
    .big-num.ocs    { color: #cc0000; }
    .big-num.close  { color: #c87000; }
    .big-num.green  { color: #007a30; }
    .big-num.urgent { color: #cc0000; }

    .dist-unit {
      font-size: 18px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: #bbb; margin-top: 2px;
    }
    .dist-unit.ocs   { color: #cc0000; }
    .dist-unit.close { color: #c87000; }
    .dist-unit.green { color: #007a30; }

    #gps-warning {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: #fff3cd; border: 1px solid #f0a500; border-radius: 6px;
      padding: 4px 12px; font-size: 11px; color: #7a5000;
      font-family: sans-serif; display: none; white-space: nowrap;
    }
    #gps-warning.visible { display: block; }

    #ping-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; background: #fff; z-index: 10;
    }
    #ping-overlay.hidden { display: none; }

    .ping-label { font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #bbb; }
    .ping-btn-row { display: flex; gap: 10px; }
    .btn-ping-big {
      padding: 14px 28px; border-radius: 10px; border: 2px solid #ddd;
      background: #fff; color: #555;
      font-size: 20px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 2px; text-transform: uppercase;
    }
    .btn-ping-big.pinged { border-color: #007a30; color: #007a30; background: #edfaf3; }
    .btn-ping-big .pcoords {
      font-size: 8px; opacity: 0.6; font-family: monospace;
      font-weight: 400; text-transform: none; letter-spacing: 0;
    }
    .btn-clear-small {
      background: none; border: none; color: #ccc; font-size: 11px;
      cursor: pointer; text-decoration: underline; font-family: sans-serif; margin-top: 4px;
    }

    #bottom { flex-shrink: 0; background: #f5f5f5; border-top: 2px solid #ddd; }

    #ctrl-row { display: flex; gap: 6px; padding: 8px 12px; }
    .btn {
      flex: 1; padding: 13px 4px; border: none; border-radius: 10px;
      font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700;
      letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
      transition: opacity 0.12s, transform 0.1s;
    }
    .btn:active { opacity: 0.7; transform: scale(0.96); }
    .btn-go       { background: #111; color: #fff; }
    .btn-recall-t { background: #cc0000; color: #fff; }
    .btn-sync     { background: #e5e5e5; color: #444; font-size: 14px; }
    .btn-reset    { background: #e5e5e5; color: #888; }
    .btn:disabled { opacity: 0.2; cursor: default; }

    #status-strip {
      text-align: center; font-size: 10px; color: #bbb;
      padding: 2px 10px 5px; font-family: sans-serif;
      letter-spacing: 0.3px; min-height: 18px;
    }

    #btn-reset-wrap { position: relative; flex: 1; }
    #btn-reset-wrap .btn { width: 100%; }
    #reset-progress {
      position: absolute; bottom: 0; left: 0;
      height: 3px; background: #cc0000; width: 0%;
      border-radius: 0 2px 2px 0; pointer-events: none;
    }
  </style>
</head>
<body>

<div id="flash"></div>

<div id="recall-overlay">
  <div class="recall-title">GENERAL RECALL</div>
  <div class="recall-sub">Neustart erforderlich</div>
  <button class="btn-recall-close" onclick="App.closeRecall()">Neustart</button>
</div>

<div class="block" id="block-timer">
  <div class="corner">TMR</div>
  <div class="dots" id="signal-dots"></div>
  <div class="big-num" id="disp-time">5:00</div>
</div>

<div id="phase-stripe"></div>

<div class="block" id="block-dist">
  <div class="corner">DTL</div>
  <div id="ping-overlay">
    <div class="ping-label">Startlinie setzen</div>
    <div class="ping-btn-row">
      <button class="btn-ping-big" id="btn-schiff" onclick="App.pingPoint('schiff')">
        Schiff<span class="pcoords" id="coords-schiff">--</span>
      </button>
      <button class="btn-ping-big" id="btn-boot" onclick="App.pingPoint('boot')">
        Boot<span class="pcoords" id="coords-boot">--</span>
      </button>
    </div>
    <button class="btn-clear-small" onclick="App.clearLine()">Loeschen</button>
  </div>
  <div class="big-num" id="disp-dist">--</div>
  <div class="dist-unit" id="disp-unit">m</div>
  <div id="gps-warning">GPS-Signal verloren</div>
</div>

<div id="bottom">
  <div id="ctrl-row">
    <button class="btn btn-go"       id="btn-main"  onclick="App.handleMain()">Start</button>
    <button class="btn btn-recall-t" id="btn-recall" onclick="App.triggerRecall()" disabled>Recall</button>
    <button class="btn btn-sync"     id="btn-sync4"  onclick="App.syncTo(240)" disabled>4 Min</button>
    <button class="btn btn-sync"     id="btn-sync1"  onclick="App.syncTo(60)"  disabled>1 Min</button>
    <div id="btn-reset-wrap">
      <button class="btn btn-reset"
        onpointerdown="App.startResetHold(event)"
        onpointerup="App.cancelResetHold()"
        onpointerleave="App.cancelResetHold()">Reset</button>
      <div id="reset-progress"></div>
    </div>
  </div>
  <div id="status-strip">Timer starten oder Linie setzen</div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════

const SEQUENCE = [
  { at: 300, color: '#c87000', label: 'Warnsignal',          freq: 660, toneDur: 1.2, flashTimes: 1 },
  { at: 240, color: '#0077aa', label: 'Vorbereitungssignal', freq: 550, toneDur: 1.2, flashTimes: 1 },
  { at:  60, color: '#cc4400', label: '1-Min-Signal',        freq: 440, toneDur: 1.2, flashTimes: 1 },
  { at:   0, color: '#007a30', label: 'Start',               freq: 880, toneDur: 1.2, flashTimes: 3 },
];

const TOTAL_SECONDS   = 300;
const HOLD_MS         = 1500;
const GPS_STORAGE_KEY = 'starttimer_line_v1';

// ═══════════════════════════════════════════════════════════
// BUILD SIGNAL DOTS FROM SEQUENCE (single source of truth)
// ═══════════════════════════════════════════════════════════

const dotContainer = document.getElementById('signal-dots');
SEQUENCE.forEach(ph => {
  const dot = document.createElement('div');
  dot.className = 'sdot';
  dot.id = 'dot-' + ph.at;
  dotContainer.appendChild(dot);
  ph.dotEl = dot; // store direct reference — no getElementById needed later
});

// ═══════════════════════════════════════════════════════════
// STATE — business logic vs infrastructure, clearly separated
// ═══════════════════════════════════════════════════════════

// Business state: what the timer is doing
const timer = {
  running:      false,
  startedAt:    null,  // Date.now() at which the current run began
  elapsedAtPause: 0,   // ms already elapsed when paused (replaces ambiguous offsetMs)
  remaining:    TOTAL_SECONDS,
  postStart:    false,
  firedSignals: new Set(),
};

// GPS state
const gps = {
  ptSchiff: null,
  ptBoot:   null,
  myPos:    null,
  stale:    false,
  watchId:  null,
};

// Infrastructure handles (not business logic)
const infra = {
  rafId:      null,
  wakeLock:   null,
  audioCtx:   null,
  resetTimer: null,
  resetStart: null,
};

// ═══════════════════════════════════════════════════════════
// DOM REFERENCES — fully cached, no getElementById at runtime
// ═══════════════════════════════════════════════════════════

const dom = {
  time:         document.getElementById('disp-time'),
  dist:         document.getElementById('disp-dist'),
  unit:         document.getElementById('disp-unit'),
  stripe:       document.getElementById('phase-stripe'),
  flash:        document.getElementById('flash'),
  status:       document.getElementById('status-strip'),
  btnMain:      document.getElementById('btn-main'),
  btnRecall:    document.getElementById('btn-recall'),
  btnSync4:     document.getElementById('btn-sync4'),
  btnSync1:     document.getElementById('btn-sync1'),
  resetBar:     document.getElementById('reset-progress'),
  pingOverlay:  document.getElementById('ping-overlay'),
  gpsWarning:   document.getElementById('gps-warning'),
  recallOverlay:document.getElementById('recall-overlay'),
  btnSchiff:    document.getElementById('btn-schiff'),
  btnBoot:      document.getElementById('btn-boot'),
  coordsSchiff: document.getElementById('coords-schiff'),
  coordsBoot:   document.getElementById('coords-boot'),
};

// ═══════════════════════════════════════════════════════════
// DISPLAY HELPERS
// ═══════════════════════════════════════════════════════════

function fmtTime(s) {
  const neg = s < 0;
  const abs = Math.abs(s);
  return (neg ? '-' : '') + Math.floor(abs / 60) + ':' + String(abs % 60).padStart(2, '0');
}

function setStatus(t)     { dom.status.textContent = t; }
function setStripe(color) { dom.stripe.style.background = color || '#ddd'; }

function setDistCls(cls) {
  dom.dist.className = 'big-num'   + (cls ? ' ' + cls : '');
  dom.unit.className = 'dist-unit' + (cls ? ' ' + cls : '');
}

function setSyncButtons(disabled) {
  dom.btnSync4.disabled = disabled;
  dom.btnSync1.disabled = disabled;
}

function updatePingOverlay() {
  const ready = !!(gps.ptSchiff && gps.ptBoot);
  dom.pingOverlay.classList.toggle('hidden', ready);
  if (!ready) { dom.dist.textContent = '--'; setDistCls(''); }
}

// ═══════════════════════════════════════════════════════════
// WAKE LOCK
// ═══════════════════════════════════════════════════════════

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    infra.wakeLock = await navigator.wakeLock.request('screen');
    infra.wakeLock.addEventListener('release', () => { infra.wakeLock = null; });
  } catch (e) {}
}

async function releaseWakeLock() {
  if (infra.wakeLock) {
    try { await infra.wakeLock.release(); } catch (e) {}
    infra.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timer.running) requestWakeLock();
});

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════

function getAudioCtx() {
  if (!infra.audioCtx) {
    infra.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return infra.audioCtx;
}

function playTone(freq, duration, volume = 0.7) {
  try {
    const ctx  = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.02);
    gain.gain.linearRampToValueAtTime(volume, t + duration - 0.1);
    gain.gain.linearRampToValueAtTime(0, t + duration);
    osc.start(t);
    osc.stop(t + duration);
  } catch (e) {}
}

// Play n short beeps with a gap between them
function playBeepSequence(freq, count, beepDur = 0.15, gap = 0.1) {
  try {
    const ctx = getAudioCtx();
    for (let i = 0; i < count; i++) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * (beepDur + gap);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.6, t + 0.01);
      gain.gain.linearRampToValueAtTime(0, t + beepDur);
      osc.start(t);
      osc.stop(t + beepDur + 0.01);
    }
  } catch (e) {}
}

// ═══════════════════════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════════════════════

// iOS speechSynthesis keepalive — prevents it from freezing after ~15s
setInterval(() => {
  if (!timer.running || !window.speechSynthesis) return;
  if (!window.speechSynthesis.speaking) {
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }
}, 10000);

function unlockSpeech() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('');
  u.lang = 'de-DE';
  u.volume = 0;
  window.speechSynthesis.speak(u);
}

function speak(text, interrupt = false) {
  if (!window.speechSynthesis) return;
  if (interrupt) window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 1.05;
  u.volume = 1.0;
  window.speechSynthesis.speak(u);
}

function announceTime(s) {
  if (s <= 0) return;
  const m   = Math.floor(s / 60);
  const sec = s % 60;
  if      (m > 0 && sec === 0) speak(m === 1 ? 'Eine Minute' : m + ' Minuten', true);
  else if (m > 0)               speak(m + ' Minuten ' + sec + ' Sekunden', true);
  else                          speak(String(sec), true);
}

// ═══════════════════════════════════════════════════════════
// FLASH
// ═══════════════════════════════════════════════════════════

function doFlash(color, times = 1) {
  dom.flash.style.background = color;
  let n = 0;
  function step() {
    dom.flash.classList.add('active');
    setTimeout(() => {
      dom.flash.classList.remove('active');
      n++;
      if (n < times) setTimeout(step, 150);
    }, 120);
  }
  step();
}

// ═══════════════════════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════════════════════

function persistLine() {
  try {
    localStorage.setItem(GPS_STORAGE_KEY, JSON.stringify({
      schiff: gps.ptSchiff,
      boot:   gps.ptBoot,
    }));
  } catch (e) {}
}

function loadPersistedLine() {
  try {
    const raw = localStorage.getItem(GPS_STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.schiff && data.boot) {
      gps.ptSchiff = data.schiff;
      gps.ptBoot   = data.boot;
      renderPingButtons();
      updatePingOverlay();
      // Do NOT start GPS watch here — wait until timer starts
    }
  } catch (e) {}
}

function renderPingButtons() {
  if (gps.ptSchiff) {
    dom.btnSchiff.classList.add('pinged');
    dom.coordsSchiff.textContent = gps.ptSchiff.lat.toFixed(4) + ' ' + gps.ptSchiff.lng.toFixed(4);
  }
  if (gps.ptBoot) {
    dom.btnBoot.classList.add('pinged');
    dom.coordsBoot.textContent = gps.ptBoot.lat.toFixed(4) + ' ' + gps.ptBoot.lng.toFixed(4);
  }
}

function pingPoint(which) {
  if (!navigator.geolocation) {
    alert('GPS nicht verfuegbar auf diesem Geraet.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const pt    = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const label = pt.lat.toFixed(4) + ' ' + pt.lng.toFixed(4);
      if (which === 'schiff') {
        gps.ptSchiff = pt;
        dom.btnSchiff.classList.add('pinged');
        dom.coordsSchiff.textContent = label;
      } else {
        gps.ptBoot = pt;
        dom.btnBoot.classList.add('pinged');
        dom.coordsBoot.textContent = label;
      }
      persistLine();
      updatePingOverlay();
      // Only start watching if timer is already running
      if (gps.ptSchiff && gps.ptBoot && timer.running) startGpsWatch();
      renderDist();
    },
    err => alert('GPS-Fehler: ' + gpsErrorMessage(err)),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function gpsErrorMessage(err) {
  switch (err.code) {
    case 1:  return 'Zugriff verweigert. GPS-Erlaubnis in den Einstellungen erteilen.';
    case 2:  return 'Position nicht verfuegbar. GPS-Signal pruefen.';
    case 3:  return 'Zeitueberschreitung. Bitte erneut versuchen.';
    default: return 'Unbekannter Fehler.';
  }
}

function startGpsWatch() {
  if (!navigator.geolocation || gps.watchId !== null) return;
  gps.watchId = navigator.geolocation.watchPosition(
    pos => {
      gps.myPos  = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      gps.stale  = false;
      dom.gpsWarning.classList.remove('visible');
      renderDist();
    },
    err => {
      gps.stale = true;
      // Code 3 = timeout — transient, don't alarm the user
      if (err.code !== 3) dom.gpsWarning.classList.add('visible');
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );
}

function stopGpsWatch() {
  if (gps.watchId !== null) {
    navigator.geolocation.clearWatch(gps.watchId);
    gps.watchId = null;
  }
}

function clearLine() {
  gps.ptSchiff = null;
  gps.ptBoot   = null;
  gps.myPos    = null;
  gps.stale    = false;
  stopGpsWatch();
  try { localStorage.removeItem(GPS_STORAGE_KEY); } catch (e) {}
  dom.btnSchiff.classList.remove('pinged');
  dom.btnBoot.classList.remove('pinged');
  dom.coordsSchiff.textContent = '--';
  dom.coordsBoot.textContent   = '--';
  dom.gpsWarning.classList.remove('visible');
  updatePingOverlay();
}

// Signed perpendicular distance (metres) from P to line A--B
// Positive = behind start line, Negative = OCS
function perpDistMetres(p, a, b) {
  const R      = 6371000;
  const lat0   = (a.lat + b.lat) / 2;
  const cosLat = Math.cos(lat0 * Math.PI / 180);
  const toM    = deg => deg * R * Math.PI / 180;

  const ax = toM(a.lng) * cosLat, ay = toM(a.lat);
  const bx = toM(b.lng) * cosLat, by = toM(b.lat);
  const px = toM(p.lng) * cosLat, py = toM(p.lat);

  const dx = bx - ax, dy = by - ay;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return 0;

  return ((px - ax) * dy - (py - ay) * dx) / len;
}

function renderDist() {
  if (!gps.ptSchiff || !gps.ptBoot || !gps.myPos) {
    dom.dist.textContent = '--';
    setDistCls('');
    return;
  }
  const d   = perpDistMetres(gps.myPos, gps.ptSchiff, gps.ptBoot);
  const abs = Math.abs(Math.round(d));
  const ocs = d < 0;
  dom.dist.textContent = (ocs ? '-' : '') + abs;
  setDistCls(ocs ? 'ocs' : abs < 20 ? 'green' : abs < 100 ? 'close' : '');
}

function renderPostStartDist() {
  const elapsed = Math.abs(timer.remaining);
  dom.dist.textContent = '+' + Math.floor(elapsed / 60) + ':' + String(elapsed % 60).padStart(2, '0');
  setDistCls('green');
  dom.unit.textContent = '';
}

// ═══════════════════════════════════════════════════════════
// SIGNAL FIRING
// ═══════════════════════════════════════════════════════════

function fireSignal(phase) {
  // Dot (direct element reference from SEQUENCE — no DOM lookup)
  phase.dotEl.style.background  = phase.color;
  phase.dotEl.style.borderColor = phase.color;
  phase.dotEl.classList.add('fired');

  setStripe(phase.color);
  playTone(phase.freq, phase.toneDur);
  doFlash(phase.color, phase.flashTimes);

  if (phase.at === 0) {
    speak('Start', true);
    setStatus('Rennen laeuft');
    timer.postStart = true;
  }
}

function resetAllDots() {
  // Driven entirely by SEQUENCE — no hardcoded dot IDs
  SEQUENCE.forEach(ph => {
    ph.dotEl.style.background  = 'transparent';
    ph.dotEl.style.borderColor = '#ddd';
    ph.dotEl.classList.remove('fired');
  });
}

// ═══════════════════════════════════════════════════════════
// TIMER — Date.now() based, RAF driven
// ═══════════════════════════════════════════════════════════

// Compute how many seconds remain right now.
// elapsedAtPause = ms already run before the current startedAt.
function computeRemaining() {
  const totalElapsedMs = (Date.now() - timer.startedAt) + timer.elapsedAtPause;
  return TOTAL_SECONDS - Math.floor(totalElapsedMs / 1000);
}

function timerLoop() {
  const rem = computeRemaining();

  if (rem !== timer.remaining) {
    timer.remaining = rem;

    dom.time.textContent = fmtTime(rem);
    dom.time.classList.toggle('urgent', rem <= 10 && rem > 0);

    // Fire signals — Set ensures each fires exactly once
    SEQUENCE.forEach(ph => {
      if (rem === ph.at && !timer.firedSignals.has(ph.at)) {
        timer.firedSignals.add(ph.at);
        fireSignal(ph);
      }
    });

    // Voice announcements
    if      (rem > 60 && rem % 30 === 0 && rem !== 300 && rem !== 240) announceTime(rem);
    else if (rem > 20 && rem <= 60 && rem % 10 === 0 && rem !== 60)    announceTime(rem);
    else if (rem > 0  && rem <= 20)                                     announceTime(rem);

    // Countdown beeps (10s before 1-min and start signals)
    if (rem === 70)            setStatus('10s bis 1-Min-Signal');
    if (rem > 60 && rem <= 70) playTone(660, 0.08, 0.5);
    if (rem === 10)            setStatus('10 Sekunden bis Start!');
    if (rem > 0 && rem <= 10)  playTone(880, 0.08, 0.5);

    // Distance display during/after start
    if (timer.postStart) {
      if (gps.ptSchiff && gps.ptBoot) renderDist();
      else renderPostStartDist();
    }

    if (rem <= -3600) { timer.running = false; return; }
  }

  infra.rafId = requestAnimationFrame(timerLoop);
}

// ═══════════════════════════════════════════════════════════
// LONG PRESS RESET
// ═══════════════════════════════════════════════════════════

function startResetHold(e) {
  e.preventDefault();
  infra.resetStart = Date.now();
  dom.resetBar.style.transition = 'none';
  dom.resetBar.style.width = '0%';
  infra.resetTimer = setInterval(() => {
    const pct = Math.min(100, (Date.now() - infra.resetStart) / HOLD_MS * 100);
    dom.resetBar.style.width = pct + '%';
    if (pct >= 100) { App.cancelResetHold(); App.resetTimer(); }
  }, 30);
}

function cancelResetHold() {
  clearInterval(infra.resetTimer);
  infra.resetTimer = null;
  dom.resetBar.style.transition = 'width 0.2s';
  dom.resetBar.style.width = '0%';
}

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════

function handleMain() {
  timer.running ? pauseTimer() : startTimer();
}

function startTimer() {
  getAudioCtx();
  unlockSpeech();
  requestWakeLock();

  // Start GPS watch only now (not on page load)
  if (gps.ptSchiff && gps.ptBoot) startGpsWatch();

  // Record when this run started; elapsedAtPause carries forward any prior progress
  timer.startedAt = Date.now();
  timer.running   = true;
  timer.postStart = false;

  dom.btnMain.textContent      = 'Pause';
  dom.btnMain.style.background = '#c87000';
  dom.btnRecall.disabled       = false;
  setSyncButtons(false);
  setStatus('Sequenz laeuft');

  // Immediately fire warning signal when starting fresh at 5:00
  if (timer.remaining === TOTAL_SECONDS && !timer.firedSignals.has(300)) {
    timer.firedSignals.add(300);
    fireSignal(SEQUENCE[0]);
  }

  infra.rafId = requestAnimationFrame(timerLoop);
}

function pauseTimer() {
  // Snapshot how many ms have elapsed so we can resume correctly
  timer.elapsedAtPause += Date.now() - timer.startedAt;
  timer.startedAt = null;
  timer.running   = false;

  cancelAnimationFrame(infra.rafId);
  releaseWakeLock();

  dom.btnMain.textContent      = 'Weiter';
  dom.btnMain.style.background = '#0077aa';
  setStatus('Pausiert');
}

function syncTo(seconds) {
  if (!timer.running) return;
  const diff = timer.remaining - seconds;
  if (diff <= 0 || diff >= 60) { setStatus('Sync nur innerhalb 60s moeglich'); return; }

  // Recompute elapsedAtPause so that computeRemaining() will return `seconds`
  // Total elapsed must be: (TOTAL_SECONDS - seconds) * 1000
  const targetElapsedMs  = (TOTAL_SECONDS - seconds) * 1000;
  timer.elapsedAtPause   = targetElapsedMs - (Date.now() - timer.startedAt);
  // Clamp to avoid negative elapsedAtPause if sync pushes time forward
  if (timer.elapsedAtPause < 0) timer.elapsedAtPause = 0;

  setStatus('Sync ' + (seconds / 60) + ' Min');
  playTone(660, 0.1, 0.6);
}

function resetTimer() {
  timer.running        = false;
  timer.postStart      = false;
  timer.remaining      = TOTAL_SECONDS;
  timer.startedAt      = null;
  timer.elapsedAtPause = 0;
  timer.firedSignals.clear();

  cancelAnimationFrame(infra.rafId);
  releaseWakeLock();
  stopGpsWatch(); // stop GPS on reset; restarts on next startTimer()

  dom.time.textContent         = fmtTime(TOTAL_SECONDS);
  dom.time.classList.remove('urgent');
  dom.unit.textContent         = 'm';
  dom.btnMain.textContent      = 'Start';
  dom.btnMain.style.background = '#111';
  dom.btnRecall.disabled       = true;
  setSyncButtons(true);
  setStatus('Timer starten oder Linie setzen');
  setStripe(null);
  resetAllDots();

  if (gps.ptSchiff && gps.ptBoot) renderDist();
  else updatePingOverlay();
}

function triggerRecall() {
  timer.running = false;
  cancelAnimationFrame(infra.rafId);
  // 6 distinct short beeps — correct recall signal
  playBeepSequence(440, 6, 0.15, 0.1);
  doFlash('#cc0000', 5);
  dom.recallOverlay.classList.add('visible');
}

function closeRecall() {
  dom.recallOverlay.classList.remove('visible');
  resetTimer();
}

// ═══════════════════════════════════════════════════════════
// PUBLIC API
// ═══════════════════════════════════════════════════════════

const App = {
  handleMain,
  pingPoint,
  clearLine,
  syncTo,
  triggerRecall,
  closeRecall,
  startResetHold,
  cancelResetHold,
  resetTimer,
};

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

loadPersistedLine();
updatePingOverlay();
</script>
