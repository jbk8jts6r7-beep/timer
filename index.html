<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Starttimer">
  <title>Starttimer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    /* ── THEMES ── */
    body {
      display: flex; flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      font-family: 'Oswald', sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    /* DAY: white bg, black text */
    body.day {
      background: #fff;
      color: #000;
      --bg:        #fff;
      --bg2:       #f5f5f5;
      --border:    #ddd;
      --border2:   #e0e0e0;
      --text:      #000;
      --muted:     #bbb;
      --btn-reset: #e5e5e5;
      --btn-reset-text: #888;
      --ping-bg:   #fff;
      --ping-text: #888;
      --stripe-default: #ddd;
      --status-color: #bbb;
    }

    /* NIGHT: black bg, white text */
    body.night {
      background: #000;
      color: #fff;
      --bg:        #000;
      --bg2:       #111;
      --border:    #333;
      --border2:   #222;
      --text:      #fff;
      --muted:     #555;
      --btn-reset: #222;
      --btn-reset-text: #666;
      --ping-bg:   #111;
      --ping-text: #555;
      --stripe-default: #333;
      --status-color: #555;
    }

    /* ── PWA BANNER ── */
    #pwa-banner {
      display: none; background: #111; color: #fff;
      padding: 10px 16px; font-family: sans-serif; font-size: 12px;
      flex-shrink: 0; align-items: center; gap: 10px;
      border-bottom: 2px solid #333;
    }
    #pwa-banner.visible { display: flex; }
    #pwa-banner strong { font-size: 13px; }
    #pwa-banner-close {
      margin-left: auto; background: none; border: 1px solid #555;
      color: #aaa; border-radius: 6px; padding: 4px 10px;
      font-size: 11px; cursor: pointer;
    }

    #flash {
      position: fixed; inset: 0; pointer-events: none;
      z-index: 999; opacity: 0; transition: opacity 0.05s;
    }
    #flash.active { opacity: 1; }

    #recall-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(200,0,0,0.96); z-index: 500;
      flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    #recall-overlay.visible { display: flex; }
    .recall-title { font-size: 72px; font-weight: 700; color: #fff; letter-spacing: 2px; }
    .recall-sub   { font-size: 16px; color: rgba(255,255,255,0.75); font-family: sans-serif; }
    .btn-recall-close {
      margin-top: 20px; padding: 16px 52px; background: #fff;
      color: #cc0000; border: none; border-radius: 10px;
      font-size: 26px; font-weight: 700; cursor: pointer;
    }

    /* ── BLOCKS ── */
    .block {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; min-height: 0;
      background: var(--bg);
    }

    #phase-stripe {
      height: 5px; flex-shrink: 0;
      background: var(--stripe-default); transition: background 0.4s;
    }

    .corner {
      position: absolute; top: 10px; left: 16px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted);
    }

    /* Theme toggle button — top right of timer block */
    #btn-theme {
      position: absolute; top: 8px; right: 16px;
      background: var(--bg2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 4px 10px;
      font-family: 'Oswald', sans-serif; font-size: 11px;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); cursor: pointer;
    }

    .dots { position: absolute; top: 40px; right: 16px; display: flex; gap: 7px; }
    .sdot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--border); background: transparent; transition: all 0.3s;
    }
    .sdot.fired { border-color: transparent; }

    .big-num {
      font-weight: 700;
      font-size: clamp(80px, 23vh, 180px);
      letter-spacing: -2px; line-height: 1;
      color: var(--text); transition: color 0.2s;
      text-align: center; width: 100%; padding: 0 6px;
      transform: scaleX(0.82);
    }
    .big-num.ocs    { color: #cc0000; }
    .big-num.close  { color: #c87000; }
    .big-num.green  { color: #007a30; }
    .big-num.urgent { color: #cc0000; }

    /* Night mode: brighter greens/oranges for readability */
    body.night .big-num.close { color: #ffaa00; }
    body.night .big-num.green { color: #00ee77; }

    .dist-unit {
      font-size: 18px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--muted); margin-top: 2px;
    }
    .dist-unit.ocs   { color: #cc0000; }
    .dist-unit.close { color: #c87000; }
    .dist-unit.green { color: #007a30; }
    body.night .dist-unit.close { color: #ffaa00; }
    body.night .dist-unit.green { color: #00ee77; }

    #gps-warning {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: #fff3cd; border: 1px solid #f0a500; border-radius: 6px;
      padding: 4px 12px; font-size: 11px; color: #7a5000;
      font-family: sans-serif; display: none; white-space: nowrap;
    }
    #gps-warning.visible { display: block; }

    /* ── BOTTOM ── */
    #bottom { flex-shrink: 0; background: var(--bg2); border-top: 2px solid var(--border); }

    #ping-row {
      display: flex; gap: 6px; padding: 6px 12px;
      border-bottom: 1px solid var(--border2);
    }

    .btn-ping {
      flex: 1; padding: 8px 6px;
      border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--ping-bg); color: var(--ping-text);
      font-family: 'Oswald', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      text-transform: uppercase;
    }
    .btn-ping.pinged  { border-color: #007a30; color: #007a30; background: #edfaf3; }
    /* Night: brighter green for contrast on dark background */
    body.night .btn-ping.pinged { background: #002a14; color: #00ee77; border-color: #00ee77; }
    .btn-ping .ping-sub {
      font-size: 8px; opacity: 0.6; font-family: monospace;
      font-weight: 400; text-transform: none; letter-spacing: 0;
    }

    .btn-clear-line {
      align-self: center; background: none; border: none;
      color: var(--muted); font-size: 10px; cursor: pointer;
      text-decoration: underline; font-family: sans-serif;
      padding: 0 2px; white-space: nowrap;
    }

    #ctrl-row { display: flex; gap: 6px; padding: 7px 12px; }
    .btn {
      flex: 1; padding: 13px 4px; border: none; border-radius: 10px;
      font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700;
      letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
      transition: opacity 0.12s, transform 0.1s;
    }
    .btn:active { opacity: 0.7; transform: scale(0.96); }
    .btn-go       { background: #111; color: #fff; }
    body.night .btn-go { background: #fff; color: #000; }
    .btn-recall-t { background: #cc0000; color: #fff; }
    .btn-adj          { background: var(--btn-reset); color: var(--btn-reset-text); font-size: 15px; }
    .btn-sync-nearest { background: #0077aa; color: #fff; font-size: 15px; }
    .btn-reset        { background: var(--btn-reset); color: var(--btn-reset-text); font-size: 15px; }
    .btn:disabled { opacity: 0.2; cursor: default; }

    #status-strip {
      text-align: center; font-size: 10px; color: var(--status-color);
      padding: 2px 10px 4px; font-family: sans-serif;
      letter-spacing: 0.3px; min-height: 16px;
    }


  </style>
</head>
<body class="day">

<div id="flash"></div>

<div id="pwa-banner">
  <div><strong>Vollbild aktivieren</strong><br>Teilen → "Zum Home-Bildschirm"</div>
  <button id="pwa-banner-close" onclick="document.getElementById('pwa-banner').style.display='none'">OK</button>
</div>

<div id="recall-overlay">
  <div class="recall-title">GENERAL RECALL</div>
  <div class="recall-sub">Neustart erforderlich</div>
  <button class="btn-recall-close" onclick="App.closeRecall()">Neustart</button>
</div>

<!-- BLOCK 1: TIMER -->
<div class="block" id="block-timer">
  <div class="corner">TMR</div>
  <button id="btn-theme" onclick="App.toggleTheme()">Nacht</button>
  <div class="dots" id="signal-dots"></div>
  <div class="big-num" id="disp-time">5:00</div>
</div>

<div id="phase-stripe"></div>

<!-- BLOCK 2: DISTANCE -->
<div class="block" id="block-dist">
  <div class="corner">DTL</div>
  <div class="big-num" id="disp-dist">--</div>
  <div class="dist-unit" id="disp-unit">m</div>
  <div id="gps-warning">GPS-Signal verloren</div>
</div>

<!-- CONTROLS -->
<div id="bottom">
  <div id="ping-row">
    <button class="btn-ping" id="btn-pin" onclick="App.pingPoint('pin')">
      Pin
      <span class="ping-sub" id="coords-pin">nicht gesetzt</span>
    </button>
    <button class="btn-ping" id="btn-boat" onclick="App.pingPoint('boat')">
      Boat
      <span class="ping-sub" id="coords-boat">nicht gesetzt</span>
    </button>
    <button class="btn-clear-line" onclick="App.clearLine()">Loeschen</button>
  </div>

  <div id="ctrl-row">
    <button class="btn btn-go"    id="btn-main"   onclick="App.handleMain()">Start</button>
    <button class="btn btn-adj"   id="btn-plus1"  onclick="App.adjustTime(-60)">-1 Min</button>
    <button class="btn btn-adj"   id="btn-minus1" onclick="App.adjustTime(+60)">+1 Min</button>
    <button class="btn btn-sync-nearest" id="btn-sync" onclick="App.syncToNearest()">Sync</button>
    <button class="btn btn-reset" id="btn-reset" onclick="App.resetTimer()">Reset</button>
  </div>
  <div id="status-strip">Linie setzen, dann Timer starten</div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════

const SEQUENCE = [
  { at: 300, color: '#c87000', label: 'Warnsignal',          freq: 660, toneDur: 1.2, flashTimes: 1 },
  { at: 240, color: '#0077aa', label: 'Vorbereitungssignal', freq: 550, toneDur: 1.2, flashTimes: 1 },
  { at:  60, color: '#cc4400', label: '1-Min-Signal',        freq: 440, toneDur: 1.2, flashTimes: 1 },
  { at:   0, color: '#007a30', label: 'Start',               freq: 880, toneDur: 1.2, flashTimes: 3 },
];

const TOTAL_SECONDS   = 300;
const GPS_STORAGE_KEY = 'starttimer_line_v2';
const THEME_KEY       = 'starttimer_theme';

// ═══════════════════════════════════════════════════════════
// BUILD SIGNAL DOTS
// ═══════════════════════════════════════════════════════════

const dotContainer = document.getElementById('signal-dots');
SEQUENCE.forEach(ph => {
  const dot = document.createElement('div');
  dot.className = 'sdot';
  dotContainer.appendChild(dot);
  ph.dotEl = dot;
});

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════

const timer = {
  running:        false,
  startedAt:      null,
  elapsedAtPause: 0,
  remaining:      TOTAL_SECONDS,
  postStart:      false,
  firedSignals:   new Set(),
};

const gps = {
  ptPin:    null,   // left end of start line (Pin)
  ptBoat:   null,   // right end of start line (Boat)
  myPos:    null,   // current live position (raw GPS)
  accuracy: null,   // current GPS accuracy in metres
  watchId:  null,
};

const infra = {
  rafId:      null,
  wakeLock:   null,
  audioCtx:   null,
};

let currentTheme = 'day';

// ═══════════════════════════════════════════════════════════
// DOM REFERENCES
// ═══════════════════════════════════════════════════════════

const dom = {
  body:          document.body,
  time:          document.getElementById('disp-time'),
  dist:          document.getElementById('disp-dist'),
  unit:          document.getElementById('disp-unit'),
  stripe:        document.getElementById('phase-stripe'),
  flash:         document.getElementById('flash'),
  status:        document.getElementById('status-strip'),
  btnMain:       document.getElementById('btn-main'),
  btnPlus1:      document.getElementById('btn-plus1'),
  btnMinus1:     document.getElementById('btn-minus1'),
  btnSync:       document.getElementById('btn-sync'),
  gpsWarning:    document.getElementById('gps-warning'),
  recallOverlay: document.getElementById('recall-overlay'),
  btnPin:        document.getElementById('btn-pin'),
  btnBoat:       document.getElementById('btn-boat'),
  coordsPin:     document.getElementById('coords-pin'),
  coordsBoat:    document.getElementById('coords-boat'),
  btnTheme:      document.getElementById('btn-theme'),
  pwaBanner:     document.getElementById('pwa-banner'),
};

// ═══════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════

function applyTheme(theme) {
  currentTheme = theme;
  dom.body.className = theme;
  dom.btnTheme.textContent = theme === 'day' ? 'Nacht' : 'Tag';
  try { localStorage.setItem(THEME_KEY, theme); } catch(e) {}
}

function toggleTheme() {
  applyTheme(currentTheme === 'day' ? 'night' : 'day');
}

function loadTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'day' || saved === 'night') applyTheme(saved);
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
// PWA DETECTION
// ═══════════════════════════════════════════════════════════

function checkPwaMode() {
  const isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (!isStandalone) dom.pwaBanner.classList.add('visible');
}

// ═══════════════════════════════════════════════════════════
// DISPLAY HELPERS
// ═══════════════════════════════════════════════════════════

function fmtTime(s) {
  const neg = s < 0, abs = Math.abs(s);
  return (neg ? '-' : '') + Math.floor(abs / 60) + ':' + String(abs % 60).padStart(2, '0');
}

function setStatus(t)     { dom.status.textContent = t; }
function setStripe(color) { dom.stripe.style.background = color || 'var(--stripe-default)'; }

function setDistCls(cls) {
  dom.dist.className = 'big-num'   + (cls ? ' ' + cls : '');
  dom.unit.className = 'dist-unit' + (cls ? ' ' + cls : '');
}

// +1 Min = mehr Zeit (Timer geht hoch), -1 Min = weniger Zeit.
// Works both running and paused.
function adjustTime(delta) {
  const current = timer.running ? computeRemaining() : timer.remaining;
  const next    = Math.max(60, Math.min(600, current + delta));
  const diff    = next - current;
  if (diff === 0) return;

  if (timer.running) {
    // To increase remaining by diff seconds, shift startedAt
    // forward (into future) by same amount — computeRemaining() will
    // then return a larger value.
    timer.startedAt += diff * 1000;
  } else {
    timer.remaining      = next;
    timer.elapsedAtPause = (TOTAL_SECONDS - next) * 1000;
    dom.time.textContent = fmtTime(next);
  }
  setStatus('Zeit: ' + fmtTime(next));
}

// Always snap DOWN to current full minute.
// e.g. 4:31 → 4:00, 4:59 → 4:00, 4:00 → 4:00 (no change)
function syncToNearest() {
  const rem     = timer.running ? computeRemaining() : timer.remaining;
  const seconds = rem % 60;
  if (seconds === 0) { setStatus('Bereits auf Minute'); return; }

  const target = rem - seconds; // always floor to full minute
  const delta  = target - rem;  // always negative

  if (timer.running) {
    timer.startedAt += delta * 1000;
  } else {
    timer.remaining      = target;
    timer.elapsedAtPause = (TOTAL_SECONDS - target) * 1000;
    dom.time.textContent = fmtTime(target);
  }
  playTone(660, 0.15, 0.5);
  setStatus('Sync → ' + fmtTime(target));
}

// ═══════════════════════════════════════════════════════════
// WAKE LOCK
// ═══════════════════════════════════════════════════════════

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    infra.wakeLock = await navigator.wakeLock.request('screen');
    infra.wakeLock.addEventListener('release', () => { infra.wakeLock = null; });
  } catch (e) {}
}

async function releaseWakeLock() {
  if (infra.wakeLock) {
    try { await infra.wakeLock.release(); } catch (e) {}
    infra.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timer.running) requestWakeLock();
});

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════

function getAudioCtx() {
  if (!infra.audioCtx) infra.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return infra.audioCtx;
}

function playTone(freq, duration, volume = 0.7) {
  try {
    const ctx = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t       = ctx.currentTime;
    const fadeEnd = Math.max(duration * 0.85, duration - 0.05);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.02);
    gain.gain.linearRampToValueAtTime(volume, t + fadeEnd);
    gain.gain.linearRampToValueAtTime(0, t + duration);
    osc.start(t);
    osc.stop(t + duration);
  } catch (e) {}
}

function playBeepSequence(freq, count, beepDur = 0.15, gap = 0.1) {
  try {
    const ctx = getAudioCtx();
    for (let i = 0; i < count; i++) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * (beepDur + gap);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.6, t + 0.01);
      gain.gain.linearRampToValueAtTime(0, t + beepDur);
      osc.start(t);
      osc.stop(t + beepDur + 0.01);
    }
  } catch (e) {}
}

// ═══════════════════════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════════════════════

setInterval(() => {
  if (!timer.running || !window.speechSynthesis) return;
  if (!window.speechSynthesis.speaking) {
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }
}, 10000);

function unlockSpeech() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('');
  u.lang = 'de-DE'; u.volume = 0;
  window.speechSynthesis.speak(u);
}

function speak(text, interrupt = false) {
  if (!window.speechSynthesis) return;
  if (interrupt) window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 1.05; u.volume = 1.0;
  window.speechSynthesis.speak(u);
}

function announceTime(s) {
  if (s <= 0) return;
  const m = Math.floor(s / 60), sec = s % 60;
  if      (m > 0 && sec === 0) speak(m === 1 ? 'Eine Minute' : m + ' Minuten', true);
  else if (m > 0)               speak(m + ' Minuten ' + sec + ' Sekunden', true);
  else                          speak(String(sec), true);
}

// ═══════════════════════════════════════════════════════════
// FLASH
// ═══════════════════════════════════════════════════════════

function doFlash(color, times = 1) {
  dom.flash.style.background = color;
  let n = 0;
  function step() {
    dom.flash.classList.add('active');
    setTimeout(() => {
      dom.flash.classList.remove('active');
      n++;
      if (n < times) setTimeout(step, 150);
    }, 120);
  }
  step();
}

// ═══════════════════════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════════════════════

function persistLine() {
  try {
    localStorage.setItem(GPS_STORAGE_KEY, JSON.stringify({
      pin:  gps.ptPin,
      boat: gps.ptBoat,
    }));
  } catch (e) {}
}

function loadPersistedLine() {
  try {
    const raw = localStorage.getItem(GPS_STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.pin && data.boat) {
      gps.ptPin  = data.pin;
      gps.ptBoat = data.boat;
      renderPingButtons();
    }
  } catch (e) {}
}

function renderPingButtons() {
  if (gps.ptPin) {
    dom.btnPin.classList.add('pinged');
    dom.coordsPin.textContent = gps.ptPin.lat.toFixed(4) + ' ' + gps.ptPin.lng.toFixed(4);
  }
  if (gps.ptBoat) {
    dom.btnBoat.classList.add('pinged');
    dom.coordsBoat.textContent = gps.ptBoat.lat.toFixed(4) + ' ' + gps.ptBoat.lng.toFixed(4);
  }
}

function pingPoint(which) {
  if (!navigator.geolocation) { alert('GPS nicht verfuegbar auf diesem Geraet.'); return; }
  const btn = which === 'pin' ? dom.btnPin : dom.btnBoat;
  btn.classList.remove('pinged');
  btn.style.opacity = '0.5';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const pt    = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const label = pt.lat.toFixed(5) + ' ' + pt.lng.toFixed(5);
      btn.style.opacity = '';
      if (which === 'pin') {
        gps.ptPin = pt;
        dom.btnPin.classList.add('pinged');
        dom.coordsPin.textContent = label;
      } else {
        gps.ptBoat = pt;
        dom.btnBoat.classList.add('pinged');
        dom.coordsBoat.textContent = label;
      }
      persistLine();
      renderDist();
      playTone(660, 0.2, 0.5);
    },
    err => {
      btn.style.opacity = '';
      alert('GPS-Fehler: ' + gpsErrorMessage(err));
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function gpsErrorMessage(err) {
  switch (err.code) {
    case 1:  return 'Zugriff verweigert. GPS-Erlaubnis in den Einstellungen erteilen.';
    case 2:  return 'Position nicht verfuegbar. GPS-Signal pruefen.';
    case 3:  return 'Zeitueberschreitung. Bitte erneut versuchen.';
    default: return 'Unbekannter Fehler.';
  }
}

// ═══════════════════════════════════════════════════════════
// GPS WATCH
//
// Uses raw GPS position directly. Pin, Boat and live position
// must all come from the same unfiltered source so the
// perpendicular-distance calculation is consistent.
// ═══════════════════════════════════════════════════════════

function startGpsWatch() {
  if (!navigator.geolocation || gps.watchId !== null) return;
  gps.watchId = navigator.geolocation.watchPosition(
    pos => {
      gps.myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      gps.accuracy = pos.coords.accuracy;
      dom.gpsWarning.classList.remove('visible');
      renderDist();
    },
    err => {
      if (err.code !== 3) dom.gpsWarning.classList.add('visible');
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000,
    }
  );
}

function stopGpsWatch() {
  if (gps.watchId !== null) {
    navigator.geolocation.clearWatch(gps.watchId);
    gps.watchId = null;
  }
}

function clearLine() {
  gps.ptPin = null; gps.ptBoat = null; gps.myPos = null;
  stopGpsWatch();
  startGpsWatch(); // keep live position running for next ping
  try { localStorage.removeItem(GPS_STORAGE_KEY); } catch (e) {}
  dom.btnPin.classList.remove('pinged');
  dom.btnBoat.classList.remove('pinged');
  dom.coordsPin.textContent  = 'nicht gesetzt';
  dom.coordsBoat.textContent = 'nicht gesetzt';
  dom.gpsWarning.classList.remove('visible');
  dom.dist.textContent = '--'; setDistCls('');
}

// ═══════════════════════════════════════════════════════════
// GEOMETRY — signed perpendicular distance to start line
//
// The start line runs from Pin (left) to Boat (right) as seen
// from a boat approaching the line on the pre-start side.
//
// We define the sign using the cross product of:
//   line vector    : Pin → Boat
//   position vector: Pin → myPos
//
// With Pin on the left and Boat on the right, a boat on the
// pre-start side (behind the line) is always on the SAME side
// of the Pin→Boat vector. That side is, by the right-hand rule,
// where the cross product is NEGATIVE.
//
//   Behind the line (pre-start)  → positive metres shown
//   Over the line (OCS)          → negative metres shown
// ═══════════════════════════════════════════════════════════

function signedDistToLine(p, pin, boat) {
  const R      = 6371000;
  const lat0   = (pin.lat + boat.lat) / 2;
  const cosLat = Math.cos(lat0 * Math.PI / 180);
  const mPerDegLat = R * Math.PI / 180;
  const mPerDegLng = mPerDegLat * cosLat;

  // Project to local metre coordinates (x = east, y = north)
  const pinX  = pin.lng  * mPerDegLng, pinY  = pin.lat  * mPerDegLat;
  const boatX = boat.lng * mPerDegLng, boatY = boat.lat * mPerDegLat;
  const pX    = p.lng    * mPerDegLng, pY    = p.lat    * mPerDegLat;

  // Line vector Pin → Boat
  const lineX = boatX - pinX;
  const lineY = boatY - pinY;
  const len   = Math.sqrt(lineX * lineX + lineY * lineY);
  if (len === 0) return 0;

  // Position vector Pin → p
  const posX = pX - pinX;
  const posY = pY - pinY;

  // 2D cross product (line × pos), normalised by line length.
  // Sign indicates which side of the Pin→Boat vector p lies on.
  const cross = (lineX * posY - lineY * posX) / len;

  // When the boat approaches with Boat on its right and Pin on its
  // left, it sits on the side where cross is negative. We keep that
  // sign so that "before the line" reads as a negative distance,
  // and crossing the line flips it to positive.
  return cross;
}

function renderDist() {
  if (!gps.ptPin || !gps.ptBoat || !gps.myPos) {
    dom.dist.textContent = '--'; setDistCls(''); return;
  }

  const signed  = signedDistToLine(gps.myPos, gps.ptPin, gps.ptBoat);
  const rounded = Math.round(signed);

  if (rounded > 0) {
    // Over the line — OCS
    dom.dist.textContent = '+' + rounded;
    setDistCls('ocs');
  } else {
    // Before the line — distance shown with minus sign
    dom.dist.textContent = rounded; // negative already has minus
    const abs = Math.abs(rounded);
    if      (abs < 20)  setDistCls('green');
    else if (abs < 100) setDistCls('close');
    else                setDistCls('');
  }
}

function renderPostStartDist() {
  const e = Math.abs(timer.remaining);
  dom.dist.textContent = '+' + Math.floor(e/60) + ':' + String(e%60).padStart(2,'0');
  setDistCls('green'); dom.unit.textContent = '';
}

// ═══════════════════════════════════════════════════════════
// SIGNAL FIRING
// ═══════════════════════════════════════════════════════════

function fireSignal(phase) {
  phase.dotEl.style.background  = phase.color;
  phase.dotEl.style.borderColor = phase.color;
  phase.dotEl.classList.add('fired');
  setStripe(phase.color);
  playTone(phase.freq, phase.toneDur);
  doFlash(phase.color, phase.flashTimes);
  if (phase.at === 0) {
    speak('Start', true);
    setStatus('Rennen laeuft');
    timer.postStart = true;
  }
}

function resetAllDots() {
  SEQUENCE.forEach(ph => {
    ph.dotEl.style.background  = 'transparent';
    ph.dotEl.style.borderColor = 'var(--border)';
    ph.dotEl.classList.remove('fired');
  });
}

// ═══════════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════════

function computeRemaining() {
  const totalElapsedMs = (Date.now() - timer.startedAt) + timer.elapsedAtPause;
  return TOTAL_SECONDS - Math.floor(totalElapsedMs / 1000);
}

function timerLoop() {
  const rem = computeRemaining();
  if (rem !== timer.remaining) {
    timer.remaining = rem;
    dom.time.textContent = fmtTime(rem);
    dom.time.classList.toggle('urgent', rem <= 10 && rem > 0);

    SEQUENCE.forEach(ph => {
      if (rem === ph.at && !timer.firedSignals.has(ph.at)) {
        timer.firedSignals.add(ph.at);
        fireSignal(ph);
      }
    });

    if      (rem > 60 && rem % 30 === 0 && rem !== 300 && rem !== 240) announceTime(rem);
    else if (rem > 20 && rem <= 60 && rem % 10 === 0 && rem !== 60)    announceTime(rem);
    else if (rem > 0  && rem <= 20)                                     announceTime(rem);

    if (rem === 70)            setStatus('10s bis 1-Min-Signal');
    if (rem > 60 && rem <= 70) playTone(660, 0.08, 0.5);
    if (rem === 10)            setStatus('10 Sekunden bis Start!');
    if (rem > 0 && rem <= 10)  playTone(880, 0.08, 0.5);

    if (timer.postStart) {
      if (gps.ptPin && gps.ptBoat) renderDist();
      else renderPostStartDist();
    }

    if (rem <= -3600) {
      // Auto-stop after 1h post-start. Clean up running state fully
      // so that any subsequent pauseTimer() call is a safe no-op.
      timer.running   = false;
      timer.startedAt = null;
      return;
    }
  }
  infra.rafId = requestAnimationFrame(timerLoop);
}

// ═══════════════════════════════════════════════════════════
// MAIN BUTTON STYLE  — single place that knows theme + state
// ═══════════════════════════════════════════════════════════

function applyMainBtnStyle(state) {
  // state: 'start' | 'pause' | 'resume'
  const night = currentTheme === 'night';
  switch (state) {
    case 'start':
      dom.btnMain.textContent      = 'Start';
      dom.btnMain.style.background = night ? '#fff' : '#111';
      dom.btnMain.style.color      = night ? '#000' : '#fff';
      break;
    case 'pause':
      dom.btnMain.textContent      = 'Pause';
      dom.btnMain.style.background = '#c87000';
      dom.btnMain.style.color      = '#fff';
      break;
    case 'resume':
      dom.btnMain.textContent      = 'Weiter';
      dom.btnMain.style.background = '#0077aa';
      dom.btnMain.style.color      = '#fff';
      break;
  }
}

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════

function handleMain() { timer.running ? pauseTimer() : startTimer(); }

function startTimer() {
  getAudioCtx();
  unlockSpeech();
  requestWakeLock();

  if (gps.ptPin && gps.ptBoat) startGpsWatch();
  timer.startedAt = Date.now();
  timer.running   = true;
  timer.postStart = false;
  applyMainBtnStyle('pause');
  setStatus('Sequenz laeuft');

  if (timer.remaining === TOTAL_SECONDS && !timer.firedSignals.has(300)) {
    timer.firedSignals.add(300);
    fireSignal(SEQUENCE[0]);
  }

  infra.rafId = requestAnimationFrame(timerLoop);
}

function pauseTimer() {
  // Guard: if timer auto-stopped (startedAt already null), nothing to do
  if (!timer.running || timer.startedAt === null) return;
  timer.elapsedAtPause += Date.now() - timer.startedAt;
  timer.startedAt = null; timer.running = false;
  cancelAnimationFrame(infra.rafId); releaseWakeLock();
  applyMainBtnStyle('resume');
  setStatus('Pausiert');
}

function syncTo(seconds) {
  if (!timer.running) return;
  const diff = timer.remaining - seconds;
  if (diff <= 0 || diff >= 60) { setStatus('Sync nur innerhalb 60s moeglich'); return; }
  const targetElapsedMs = (TOTAL_SECONDS - seconds) * 1000;
  timer.elapsedAtPause  = targetElapsedMs - (Date.now() - timer.startedAt);
  if (timer.elapsedAtPause < 0) timer.elapsedAtPause = 0;
  setStatus('Sync ' + (seconds / 60) + ' Min');
  playTone(660, 0.1, 0.6);
}

function resetTimer() {
  timer.running = false; timer.postStart = false;
  timer.remaining = TOTAL_SECONDS; timer.startedAt = null;
  timer.elapsedAtPause = 0; timer.firedSignals.clear();
  cancelAnimationFrame(infra.rafId); releaseWakeLock(); stopGpsWatch();
  dom.time.textContent         = fmtTime(TOTAL_SECONDS);
  dom.time.classList.remove('urgent');
  dom.unit.textContent         = 'm';
  applyMainBtnStyle('start');
  setStatus('Linie setzen, dann Timer starten');
  setStripe(null);
  resetAllDots();
  if (gps.ptPin && gps.ptBoat) renderDist();
  else { dom.dist.textContent = '--'; setDistCls(''); }
}

function triggerRecall() {
  timer.running = false;
  cancelAnimationFrame(infra.rafId);
  playBeepSequence(440, 6, 0.15, 0.1);
  doFlash('#cc0000', 5);
  dom.recallOverlay.classList.add('visible');
}

function closeRecall() {
  dom.recallOverlay.classList.remove('visible');
  resetTimer();
}

// ═══════════════════════════════════════════════════════════
// PUBLIC API
// ═══════════════════════════════════════════════════════════

const App = {
  handleMain, pingPoint, clearLine, toggleTheme,
  adjustTime, syncToNearest, triggerRecall, closeRecall,
  resetTimer,
};

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

loadTheme();
checkPwaMode();
loadPersistedLine();

// Start GPS watch immediately on load so DTL shows
// even before the timer is started.
startGpsWatch();
</script>
